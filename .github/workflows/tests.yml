name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      - name: Install test server dependencies
        run: pip install -r qa-automation-engineer-api-course/requirements.txt

      - name: Start a test server (debug + logs)
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///${{ runner.temp }}/local_${{ github.run_id }}_${{ github.run_attempt }}.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          uvicorn main:app \
            --host 0.0.0.0 --port 8000 \
            --app-dir ./qa-automation-engineer-api-course \
            --log-level debug \
            --access-log \
            > server.log 2>&1 &
          echo $! > server.pid
          sleep 1
          echo "Server PID: $(cat server.pid)"

      - name: Wait for API to be ready
        run: |
          for i in {1..40}; do
            curl -sf http://localhost:8000/docs >/dev/null && echo "API is up" && exit 0
            sleep 1
          done
          echo "API did not start in time"
          echo "===== server.log (last 300 lines) ====="
          tail -n 300 server.log || true
          exit 1

      # Smoke: повторяем минимальный happy-path: users -> login -> files -> courses
      # ВАЖНО: camelCase поля как ожидает сервер
      - name: create user + login + file + course (print responses)
        run: |
          set -euo pipefail

          echo "== Create user =="
          USER_EMAIL="ci_user_${{ github.run_id }}_${{ github.run_attempt }}@example.com"
          USER_PASS="Passw0rd!"
          USER_JSON=$(jq -nc \
            --arg email "$USER_EMAIL" \
            --arg password "$USER_PASS" \
            --arg lastName "CI" \
            --arg firstName "User" \
            --arg middleName "Run" \
            '{email:$email,password:$password,lastName:$lastName,firstName:$firstName,middleName:$middleName}')

          curl -sS -D /tmp/u.h -o /tmp/u.json -X POST http://localhost:8000/api/v1/users \
            -H "Content-Type: application/json" \
            -d "$USER_JSON" || true
          echo "--- headers ---"; cat /tmp/u.h || true
          echo "--- body ---"; cat /tmp/u.json || true

          USER_ID=$(cat /tmp/u.json | jq -r '.user.id // empty')
          if [ -z "$USER_ID" ]; then
            echo "User id is empty -> failing."
            tail -n 300 server.log || true
            exit 1
          fi

          echo "== Login =="
          LOGIN_JSON=$(jq -nc --arg email "$USER_EMAIL" --arg password "$USER_PASS" '{email:$email,password:$password}')
          curl -sS -D /tmp/l.h -o /tmp/l.json -X POST http://localhost:8000/api/v1/authentication/login \
            -H "Content-Type: application/json" \
            -d "$LOGIN_JSON" || true
          echo "--- headers ---"; cat /tmp/l.h || true
          echo "--- body ---"; cat /tmp/l.json || true

          TOKEN=$(cat /tmp/l.json | jq -r '.token.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "Token is empty -> failing."
            tail -n 300 server.log || true
            exit 1
          fi

          echo "== Create file =="
          FILE_JSON=$(jq -nc \
            --arg filename "ci.png" \
            --arg directory "tests" \
            --arg uploadedByUserId "$USER_ID" \
            '{filename:$filename,directory:$directory,uploadedByUserId:$uploadedByUserId}')

          curl -sS -D /tmp/f.h -o /tmp/f.json -X POST http://localhost:8000/api/v1/files \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer '"$TOKEN"'" \
            -d "$FILE_JSON" || true
          echo "--- headers ---"; cat /tmp/f.h || true
          echo "--- body ---"; cat /tmp/f.json || true

          FILE_ID=$(cat /tmp/f.json | jq -r '.file.id // empty')
          if [ -z "$FILE_ID" ]; then
            echo "File id is empty -> failing."
            tail -n 300 server.log || true
            exit 1
          fi

          echo "== Create course =="
          COURSE_JSON=$(jq -nc \
            --arg title "CI Course" \
            --arg description "CI course description" \
            --arg estimatedTime "2 weeks" \
            --arg previewFileId "$FILE_ID" \
            --arg createdByUserId "$USER_ID" \
            --argjson maxScore 100 \
            --argjson minScore 10 \
            '{title:$title,maxScore:$maxScore,minScore:$minScore,description:$description,estimatedTime:$estimatedTime,previewFileId:$previewFileId,createdByUserId:$createdByUserId}')

          curl -sS -D /tmp/c.h -o /tmp/c.json -X POST http://localhost:8000/api/v1/courses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer '"$TOKEN"'" \
            -d "$COURSE_JSON" || true
          echo "--- headers ---"; cat /tmp/c.h || true
          echo "--- body ---"; cat /tmp/c.json || true

          echo "== Done smoke =="

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -m regression --alluredir=allure-results -vv

      - name: Print server log (last 400 lines)
        if: always()
        run: |
          echo "===== server.log (last 400 lines) ====="
          tail -n 400 server.log || true

      - name: Upload server log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

      - name: Stop server
        if: always()
        run: |
          kill $(cat server.pid) || true

      - name: Get Allure history
        uses: actions/checkout@v6
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
