# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: API tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1) Клонируем ваш репозиторий (с автотестами)
      - name: Check out repository
        uses: actions/checkout@v6

      # 2) Ставим Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 3) Клонируем репозиторий тестового сервера
      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      # 4) Ставим зависимости тестового сервера
      - name: Install test server dependencies
        run: pip install -r qa-automation-engineer-api-course/requirements.txt

      # 5) Запускаем сервер И пишем его stdout/stderr в server.log + сохраняем PID
      - name: Start a test server (with logs)
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir ./qa-automation-engineer-api-course > server.log 2>&1 &
          echo $! > server.pid

      # 6) (рекомендовано) Ждём пока сервер реально поднимется
      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/docs >/dev/null && echo "API is up" && exit 0
            sleep 1
          done
          echo "API did not start in time"
          echo "===== server.log (last 200 lines) ====="
          tail -n 200 server.log || true
          exit 1

      # 7) Ставим зависимости вашего проекта (автотестов)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 8) Запускаем тесты
      - name: Run API tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # 9) Если тесты упали — показываем логи сервера (это ключевое)
      - name: Show server log on failure
        if: failure()
        run: |
          echo "===== server.log (last 200 lines) ====="
          tail -n 200 server.log || true

      # 10) Всегда останавливаем сервер
      - name: Stop server
        if: always()
        run: |
          kill $(cat server.pid) || true

      # 11) Забираем историю Allure (если есть)
      - name: Get Allure history
        uses: actions/checkout@v6
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 12) Генерируем отчёт Allure
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 13) Деплоим отчёт на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
