name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      - name: Print server commit
        run: git -C qa-automation-engineer-api-course rev-parse HEAD

      - name: Install test server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bcrypt==4.0.1"
          pip install -r qa-automation-engineer-api-course/requirements.txt

      - name: Freeze server deps
        run: |
          pip freeze > server_freeze.txt
          tail -n 50 server_freeze.txt

      - name: Start test server
        run: |
          APP_HOST="http://localhost:8000" \
          DATABASE_URL="sqlite+aiosqlite:///./ci_${{ github.run_id }}.db" \
          JWT_ALGORITHM="HS256" \
          JWT_SECRET_KEY="qa-automation-engineer-api-course-secret-key" \
          JWT_ACCESS_TOKEN_EXPIRE=1800 \
          JWT_REFRESH_TOKEN_EXPIRE=5184000 \
          uvicorn main:app \
            --host 0.0.0.0 --port 8000 \
            --app-dir ./qa-automation-engineer-api-course \
            --log-level debug > server.log 2>&1 &
          echo "UVICORN_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests with pytest (debug)
        run: |
          pytest -k "test_get_courses" -s -vv --maxfail=1

      - name: Show server log on failure
        if: failure()
        run: |
          echo "--- server.log tail ---"
          tail -n 300 server.log
          echo "--- ci-debug markers ---"
          grep -n "ci-debug-" server.log || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: |
            server.log
            server_freeze.txt

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
