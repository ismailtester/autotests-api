name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      - name: Install test server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bcrypt==4.0.1"
          pip install -r qa-automation-engineer-api-course/requirements.txt

      - name: Start test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: |
          uvicorn main:app \
            --host 0.0.0.0 --port 8000 \
            --app-dir ./qa-automation-engineer-api-course \
            --log-level debug > server.log 2>&1 &
          echo "UVICORN_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests (no xdist)
        run: pytest -m regression --alluredir=allure-results

      - name: Show server log on failure
        if: failure()
        run: |
          echo "--- server.log tail ---"
          tail -n 300 server.log
